# Quality gates — coverage, dependency advisories, license audit.
#
# Schedule: weekly (Sunday 04:00 UTC) + on every push to main. PRs are NOT
# gated by this workflow (CI does fmt/clippy/test/check/build); this is
# informational, the weekly cron is the source of truth for the badge.

name: Quality

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Rust coverage — llvm-cov → lcov → Codecov
  # ---------------------------------------------------------------------------
  coverage:
    name: rust coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: cargo install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov
        run: |
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml \
            --lcov --output-path lcov.info --all-features --locked
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Dependency advisories
  # ---------------------------------------------------------------------------
  rust-audit:
    name: cargo audit + cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo install cargo-audit cargo-deny
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny
      - name: cargo audit
        run: cargo audit --manifest-path src-tauri/Cargo.toml
      - name: cargo deny check
        run: cargo deny --manifest-path src-tauri/Cargo.toml check

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (moderate+ only, registry fallback enabled)
        run: npm audit --audit-level=moderate

  # ---------------------------------------------------------------------------
  # Rust -> TypeScript binding drift check
  # ---------------------------------------------------------------------------
  # The `src/lib/types.generated.ts` file is generated from `src-tauri/src/types.rs`
  # via `ts-rs` on every `cargo test --test ts_export` invocation. This
  # job runs that test, then asserts the generated file matches what's
  # committed to the repo (`git diff --exit-code`). A non-empty diff
  # means a Rust DTO was changed without regenerating the TS bindings
  # \u2014 the build fails, the contributor runs `cargo test --test
  # ts_export` locally, commits the regenerated file, and the diff
  # resolves to empty. Belt-and-suspenders for the type contract.
  ts-rs-drift:
    name: ts-rs drift check (Rust \u2192 TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: regenerate typescript bindings
        run: cargo test --manifest-path src-tauri/Cargo.toml --test ts_export
      - name: assert no drift
        # Exit code 0 if no diff, 1 if there is. `git diff --exit-code`
        # is the right primitive: `--quiet` swallows the diff body so
        # the log stays small even if the check fails.
        run: |
          if ! git diff --exit-code --quiet src/lib/types.generated.ts; then
            echo "::error::src/lib/types.generated.ts is out of date."
            echo "::error::Run \`cargo test --test ts_export\` locally and commit the result."
            git diff --stat src/lib/types.generated.ts
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Frontend test runner
  # ---------------------------------------------------------------------------
  vitest:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --reporter=default
        continue-on-error: true
        # Vitest is opt-in: a green run is a goal, but it shouldn't gate the
        # whole pipeline while we build out coverage. Switch to `false` once
        # we have a real test suite.
